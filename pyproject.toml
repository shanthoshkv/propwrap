[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "propwrap"
version = "0.1.0"
description = "SI-native Python library for liquid bipropellant thermochemistry on NASA CEA (RocketCEA) with Cantera cross-checks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Shanthosh K V", email = "shanthoshkv@users.noreply.github.com" },
]
maintainers = [
    { name = "Shanthosh K V", email = "shanthoshkv@users.noreply.github.com" },
]
keywords = [
    "rocket",
    "propellant",
    "CEA",
    "RocketCEA",
    "Cantera",
    "Isp",
    "thermochemistry",
    "liquid rocket",
    "SI",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "rocketcea>=1.2.0",
    "cantera>=3.0.0",
    "pydantic>=2.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
propwrap = "propwrap.cli:main"

[project.urls]
Homepage = "https://github.com/shanthoshkv/propwrap"
Repository = "https://github.com/shanthoshkv/propwrap"
Issues = "https://github.com/shanthoshkv/propwrap/issues"
Documentation = "https://github.com/shanthoshkv/propwrap/blob/main/docs/how_to_use.md"
Changelog = "https://github.com/shanthoshkv/propwrap/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
propwrap = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["propwrap"]

[[tool.mypy.overrides]]
module = ["rocketcea.*", "cantera.*", "matplotlib.*"]
ignore_missing_imports = true
