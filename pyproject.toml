[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "propwrap"
version = "0.1.0"
description = "Unified RocketCEA/Cantera propellant performance library for liquid rocket engines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "propwrap contributors" }]
keywords = ["rocket", "propellant", "CEA", "RocketCEA", "Cantera", "Isp", "thermochemistry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "rocketcea>=1.2.0",
    "cantera>=3.0.0",
    "pydantic>=2.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
]

[project.scripts]
propwrap = "propwrap.cli:main"

[project.urls]
Homepage = "https://github.com/example/propwrap"
Documentation = "docs/api_reference.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["propwrap"]

[[tool.mypy.overrides]]
module = ["rocketcea.*", "cantera.*", "matplotlib.*"]
ignore_missing_imports = true
